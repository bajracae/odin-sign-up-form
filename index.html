<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div id="container">
			<div id="left">
				<div id="logo">
					<img id="logo-icon" src="odin-lined.png" alt="odin logo" />
					<p id="logo-name">ODIN</p>
				</div>
			</div>
			<div id="right">
				<div id="quote">
					<p>
						This is not a real online service! You know you need something like
						this in your life to help you realize your deepest dreams. Sign up
						<em>now</em> to get started.
					</p>
					<p>You <em>know</em> you want to.</p>
				</div>
				<div id="form">
                    <h2>Let's do this!</h2>
					<form action="#" , method="post">
						<label for="first_name">First Name</label>
						<input type="text" id="first_name" placeholder="First Name" />

						<label for="last_name">Last Name</label>
						<input type="text" id="last_name" placeholder="Last Name" />

						<label for="email">Email</label>
						<input type="email" id="email" placeholder="Email" />

						<!-- NEED TO FORMAT PHONE NUMBER INPUT ACCORDINGLY -->
						<label for="phone_number">Phone Number</label>
						<input type="text" id="phone_number" placeholder="Phone Number" />

						<label for="password">Password</label>
						<input type="password" id="password" placeholder="Password" />

						<label for="confirm_password">Confirm Password</label>
						<input
							type="password"
							id="confirm_password"
							placeholder="Confirm Password"
						/>
					</form>
				</div>
				<div id="buttons">
					<button type="submit">Create Account</button>
					<p>Already have an account? <a href="#">Log in</a></p>
				</div>
			</div>
		</div>
	</body>
</html>
