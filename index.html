<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div id="container">
			<div id="left">
				<div id="logo-container">
					<img id="logo-icon" src="odin-lined.png" alt="odin logo" />
					<p id="logo-name">ODIN</p>
				</div>
			</div>
			<div id="right">
				<div id="quote-container">
					<p>
						This is not a real online service! You know you need something like
						this in your life to help you realize your deepest dreams. Sign up
						<em>now</em> to get started. <br /><br />You <em>know</em> you want
						to.
					</p>
				</div>
				<div id="form-container">
					<p>Let's do this!</p>
					<form action="#" , method="post">
						<div>
							<label for="first_name">FIRST NAME</label>
							<input type="text" id="first_name" placeholder="Thor" required />
						</div>

						<div>
							<label for="last_name">LAST NAME</label>
							<input
								type="text"
								id="last_name"
								placeholder="Odinson"
								required
							/>
						</div>

						<div>
							<label for="email">EMAIL</label>
							<input
								type="email"
								id="email"
								placeholder="thor.odinson@email.com"
								required
							/>
						</div>

						<div>
							<label for="phone_number">PHONE NUMBER</label>
							<input
								type="tel"
								id="phone_number"
								pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
								placeholder="123-456-7890"
								required
							/>
						</div>

						<div>
							<label for="password">PASSWORD</label>
							<input type="password" id="password" minlength="8" required />
						</div>

						<div>
							<label for="confirm_password">CONFIRM PASSWORD</label>
							<input
								type="password"
								id="confirm_password"
								minlength="8"
								required
							/>
						</div>
					</form>
				</div>
				<div id="buttons-container">
					<div>
						<button id="submit-button" type="submit">Create Account</button>
						<p>Already have an account? <a href="#">Log in</a></p>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
